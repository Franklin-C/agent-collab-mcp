name: Release connector on GitHub
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed package version with an existing matching vVERSION tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: connector-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'Franklin-C/agent-collab-mcp'
    runs-on: ubuntu-latest
    environment: connector-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Verify reviewed version and existing tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-release.mjs "$EXPECTED_VERSION"
      - name: Pack source artifact
        run: npm pack --ignore-scripts --json > packed.json
      - uses: actions/upload-artifact@v4
        with:
          name: connector-${{ inputs.version }}
          path: '*.tgz'
      - name: Create GitHub release and verify the downloaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE=$(node -p 'JSON.parse(require("fs").readFileSync("packed.json", "utf8"))[0].filename')
          TAG="v$EXPECTED_VERSION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --verify-tag --title "$TAG" --generate-notes
          gh release download "$TAG" --pattern "$ARCHIVE" --dir "$RUNNER_TEMP/connector-release-check"
          cmp "$ARCHIVE" "$RUNNER_TEMP/connector-release-check/$ARCHIVE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease
